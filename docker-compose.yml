services:
  database:
    image: postgres:15-alpine
    container_name: ttcs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ttcs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ttcs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ttcs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttcs_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # DB_USER (ttcs_app) is the least-privilege application role; DB_ADMIN_USER
      # is used only for Alembic and role bootstrap. They must stay distinct so
      # the API can never bypass row-level security.
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ttcs_db
      DB_USER: ttcs_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DB_ADMIN_USER: admin
      DB_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: "False"
      # Both the containerised frontend (3000) and the Vite dev server (5173).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Plain HTTP on localhost: a browser will not store a Secure cookie over
      # http://, which makes local login impossible. This stays "True" in any
      # environment reached over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@gmail.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@ttcs.local}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:?Set SYSTEM_ADMIN_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status == 200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ttcs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttcs_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ttcs_network

volumes:
  postgres_data:
    driver: local

networks:
  ttcs_network:
    driver: bridge
