services:
  database:
    image: postgres:15-alpine
    container_name: ttcs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ttcs_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ttcs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-admin} -d ${DB_NAME:-ttcs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ttcs_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ttcs_db}
      DB_USER: ${DB_USER:-ttcs_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ttcs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttcs_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ttcs_network

volumes:
  postgres_data:
    driver: local

networks:
  ttcs_network:
    driver: bridge
