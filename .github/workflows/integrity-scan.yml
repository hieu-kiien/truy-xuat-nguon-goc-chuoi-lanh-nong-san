name: Weekly Integrity Scan

# N3-74: chay dinh ky kiem tra toan ven chuoi su kien cho moi lo hang.
# The scanner runs with the privileged maintenance role because it has to read
# the lots and the events of every organization.

on:
  schedule:
    # 03:20 every Monday (UTC)
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      rotation_days:
        description: "Re-verify every lot at least once per this many days"
        default: "7"

permissions:
  contents: read

jobs:
  scan:
    name: 🔍 Integrity scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements-dev.txt

      - name: Run the integrity scan
        env:
          DATABASE_URL_ENV: ${{ secrets.STAGING_DATABASE_URL }}
          MIGRATION_DATABASE_URL_ENV: ${{ secrets.STAGING_DATABASE_URL }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_ADMIN_USER: ${{ secrets.STAGING_DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
        run: |
          if [ -z "${DATABASE_URL_ENV}" ]; then
            echo "::warning::Chưa cấu hình STAGING_DATABASE_URL trong GitHub Secrets — bỏ qua quét định kỳ trên staging."
            exit 0
          fi
          cd backend
          python -m app.jobs.integrity_scanner \
            --once \
            --rotation-days "${{ inputs.rotation_days || '7' }}"

      - name: Publish the scan summary
        uses: actions/upload-artifact@v4
        with:
          name: integrity-scan-log
          path: ${{ github.workspace }}/backend/integrity-scan.log
          if-no-files-found: ignore
