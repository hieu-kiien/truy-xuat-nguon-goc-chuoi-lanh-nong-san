name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: 🐍 Backend (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ttcs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ttcs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ttcs_test
      DB_USER: ttcs_app
      DB_PASSWORD: app-test-password
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: postgres-test-password
      APP_ENV: test
      DEBUG: "false"
      ENABLE_DEMO_LOGIN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements-dev.txt

      - name: Run linter (Ruff)
        run: |
          cd backend
          ruff check app/ tests/

      - name: Check formatting (Ruff)
        run: |
          cd backend
          ruff format --check app/ tests/

      - name: Run database migrations and schema check
        run: |
          cd backend
          python -m app.bootstrap_db_role
          alembic upgrade head
          alembic check

      - name: Run backend integration tests (Pytest)
        run: |
          cd backend
          pytest tests/ -v

  frontend-check:
    name: ⚛️ Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  docker-check:
    name: 🐳 Docker Images Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ttcs-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ttcs-frontend:ci ./frontend
