name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Kiểm tra Backend (Python / FastAPI)
  # ----------------------------------------------------------------------------
  backend-check:
    name: 🐍 Backend (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: 🧹 Run Ruff Linter
        run: |
          cd backend
          ruff check app/ tests/

      - name: 🎨 Run Ruff Format Check
        run: |
          cd backend
          ruff format --check app/ tests/

      - name: 🧪 Run Pytest
        run: |
          cd backend
          pytest tests/ -v

  # ----------------------------------------------------------------------------
  # 2. Kiểm tra Frontend (React / TypeScript)
  # ----------------------------------------------------------------------------
  frontend-check:
    name: ⚛️ Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd frontend
          npm ci

      - name: 🧹 Run Linter
        run: |
          cd frontend
          npm run lint

      - name: 🏗️ Run Build (Typecheck & Compile)
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # 3. Kiểm tra Build Docker Image
  # ----------------------------------------------------------------------------
  docker-check:
    name: 🐳 Docker Images Build Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Backend Docker Image
        run: docker build -t ttcs-backend:ci ./backend

      - name: 🐳 Build Frontend Docker Image
        run: docker build -t ttcs-frontend:ci ./frontend
