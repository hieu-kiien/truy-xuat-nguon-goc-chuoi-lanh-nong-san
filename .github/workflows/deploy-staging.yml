name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://ttcs-frontend-staging.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger deployment webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -o /dev/null -X POST "$DEPLOY_HOOK"
          else
            echo "No deploy hook configured; waiting for Render's GitHub auto-deploy and verifying the public API."
          fi

  verify-staging:
    name: Verify current release and Sprint 1–8 API on staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify readiness, release SHA and Sprint 1–8 routes
        env:
          OPENAPI_URL: https://ttcs-backend-staging.onrender.com/openapi.json
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOY_HOOK_CONFIGURED: ${{ secrets.RENDER_DEPLOY_HOOK != '' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.request import Request, urlopen

          expected = {
              "/api/v1/products/": {"get", "post"},
              "/api/v1/lots/": {"get", "post"},
              "/api/v1/events/": {"get", "post"},
              "/api/v1/events/lots/{lot_id}/history": {"get"},
              "/api/v1/events/lots/{lot_id}/integrity": {"get"},
              "/api/v1/events/integrity/summary": {"get"},
              "/api/v1/handovers/organizations": {"get"},
              "/api/v1/handovers/incoming": {"get"},
              "/api/v1/handovers/outgoing": {"get"},
              "/api/v1/handovers/": {"post"},
              "/api/v1/handovers/{handover_id}/accept": {"post"},
              "/api/v1/handovers/{handover_id}/reject": {"post"},
              "/api/v1/lots/{lot_id}/split": {"post"},
              "/api/v1/lots/merge": {"post"},
              "/api/v1/lots/{lot_id}/lineage": {"get"},
              "/api/v1/lots/{lot_id}/consume": {"post"},
              "/api/v1/lots/{lot_id}/input-lots": {"get", "post"},
              "/api/v1/lots/{lot_id}/processing-steps": {"get", "post"},
              "/api/v1/locations/": {"get", "post"},
              "/api/v1/imports/{kind}": {"post"},
              "/api/v1/audit/": {"get"},
              "/api/v1/notifications": {"get"},
              "/api/v1/organizations/me": {"get"},
              "/api/v1/organizations/me/contact-email": {"put"},
              "/api/v1/organizations/invitations": {"get", "post"},
              "/api/v1/organizations/members": {"get"},
              "/api/v1/processing-steps/": {"get", "post"},
              "/api/v1/recalls": {"get", "post"},
              "/api/v1/recalls/notifications": {"get"},
              "/api/v1/shipments": {"get", "post"},
              "/api/v1/telemetry/readings": {"post"},
              "/api/v1/telemetry/shipments/{shipment_id}/readings": {"get"},
              "/api/v1/telemetry/shipments/{shipment_id}/readings/hourly": {"get"},
              "/api/v1/telemetry/shipments/{shipment_id}/violations": {"get"},
              "/api/v1/telemetry/violations/stats": {"get"},
              "/api/v1/public/trace/{lot_code}/route": {"get"},
              "/health": {"get"},
              "/version": {"get"},
          }
          url = os.environ["OPENAPI_URL"]
          expected_commit = os.environ["EXPECTED_COMMIT"]
          deploy_hook_configured = os.environ.get("DEPLOY_HOOK_CONFIGURED") == "true"
          github_token = os.environ.get("GITHUB_TOKEN")
          github_repo = os.environ.get("GITHUB_REPOSITORY")
          last_error = "OpenAPI has not been checked yet"

          print(f"Beginning staging verification for expected commit: {expected_commit}")

          def check_render_deploy_failure() -> str | None:
              """Check whether Render reported a failed deployment for this commit to GitHub."""
              if not github_token or not github_repo:
                  return None
              try:
                  req = Request(
                      f"https://api.github.com/repos/{github_repo}/deployments?sha={expected_commit}",
                      headers={
                          "Authorization": f"Bearer {github_token}",
                          "Accept": "application/vnd.github.v3+json",
                          "User-Agent": "GitHub-Actions-Verify",
                      },
                  )
                  with urlopen(req, timeout=5) as response:
                      deployments = json.load(response)
                  if not isinstance(deployments, list):
                      return None
                  for dep in deployments:
                      env_name = dep.get("environment", "")
                      if "backend" not in env_name and env_name != "staging":
                          continue
                      statuses_url = dep.get("statuses_url")
                      if not statuses_url:
                          continue
                      sreq = Request(
                          statuses_url,
                          headers={
                              "Authorization": f"Bearer {github_token}",
                              "Accept": "application/vnd.github.v3+json",
                              "User-Agent": "GitHub-Actions-Verify",
                          },
                      )
                      with urlopen(sreq, timeout=5) as sresp:
                          statuses = json.load(sresp)
                      if isinstance(statuses, list) and len(statuses) > 0:
                          latest_state = statuses[0].get("state")
                          if latest_state in {"failure", "error"}:
                              desc = statuses[0].get("description", "Deploy failed")
                              return f"Deployment '{env_name}' marked as {latest_state}: {desc}"
              except Exception:
                  pass
              return None

          max_attempts = 20 if deploy_hook_configured else 3
          for attempt in range(1, max_attempts + 1):
              if attempt > 1:
                  early_failure = check_render_deploy_failure()
                  if early_failure:
                      print(
                          f"Render deployment failure detected early: {early_failure}",
                          file=sys.stderr,
                      )
                      sys.exit(1)

              try:
                  with urlopen(url, timeout=15) as response:
                      document = json.load(response)
                  paths = document.get("paths", {})
                  base_url = url.removesuffix("/openapi.json")
                  with urlopen(base_url + "/health", timeout=15) as response:
                      if json.load(response).get("status") != "ok":
                          raise RuntimeError("Database or maintenance is not ready")
                  with urlopen(base_url + "/version", timeout=15) as response:
                      commit = json.load(response).get("commit")
                  missing = [
                      f"{path} [{', '.join(sorted(methods - set(paths.get(path, {}))))}]"
                      for path, methods in expected.items()
                      if not methods.issubset(set(paths.get(path, {})))
                  ]
                  if missing:
                      raise RuntimeError("Missing route methods: " + "; ".join(missing))
                  if commit != expected_commit:
                      if deploy_hook_configured:
                          raise RuntimeError(
                              f"Staging serves commit '{commit}', expected '{expected_commit}'"
                          )
                      print(
                          f"::notice::Render deploy hook is not configured; staging health and all {len(expected)} Sprint 1–8 API route contracts are verified (serving commit '{commit}')."
                      )
                      sys.exit(0)
                  print(
                      f"Verified release {commit}: database ready and all {len(expected)} route contracts present."
                  )
                  sys.exit(0)
              except Exception as error:
                  last_error = f"Could not verify staging OpenAPI: {error}"

              print(f"Attempt {attempt}/{max_attempts}: {last_error}")
              if attempt < max_attempts:
                  time.sleep(20)

          print(f"Staging verification failed: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY
