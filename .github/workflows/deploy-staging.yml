name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Trigger staging rollout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://ttcs-frontend-staging.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger deployment webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST -o /dev/null "$DEPLOY_HOOK"
          else
            echo "No deploy hook configured; waiting for the Render GitHub auto-deploy integration."
          fi

      # Verify rollout separately with scripts/verify_staging.py.
      # A blocking check here can deadlock Render's After CI Checks Pass mode.
