name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://ttcs-frontend-staging.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger deployment webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -o /dev/null -X POST "$DEPLOY_HOOK"
          else
            echo "No deploy hook configured; waiting for Render's GitHub auto-deploy and verifying the public API."
          fi

  verify-staging:
    name: Verify Sprint 2 API on staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for Sprint 2 API routes to be deployed
        env:
          OPENAPI_URL: https://ttcs-backend-staging.onrender.com/openapi.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.request import urlopen

          expected = {
              "/api/v1/products/": {"get", "post"},
              "/api/v1/lots/": {"get", "post"},
              "/api/v1/events/": {"get", "post"},
              "/api/v1/events/lots/{lot_id}/history": {"get"},
              "/api/v1/events/lots/{lot_id}/integrity": {"get"},
              "/api/v1/handovers/organizations": {"get"},
              "/api/v1/handovers/incoming": {"get"},
              "/api/v1/handovers/outgoing": {"get"},
              "/api/v1/handovers/": {"post"},
              "/api/v1/handovers/{handover_id}/accept": {"post"},
              "/api/v1/handovers/{handover_id}/reject": {"post"},
          }
          url = os.environ["OPENAPI_URL"]
          last_error = "OpenAPI has not been checked yet"

          for attempt in range(1, 19):
              try:
                  with urlopen(url, timeout=20) as response:
                      document = json.load(response)
                  paths = document.get("paths", {})
                  missing = [
                      f"{path} [{', '.join(sorted(methods - set(paths.get(path, {}))))}]"
                      for path, methods in expected.items()
                      if not methods.issubset(set(paths.get(path, {})))
                  ]
                  if not missing:
                      print(f"Staging OpenAPI exposes all {len(expected)} Sprint 2 route contracts.")
                      sys.exit(0)
                  last_error = "Missing route methods: " + "; ".join(missing)
              except Exception as error:
                  last_error = f"Could not read staging OpenAPI: {error}"

              print(f"Attempt {attempt}/18: {last_error}")
              if attempt < 18:
                  time.sleep(30)

          print(f"Staging verification failed: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY
