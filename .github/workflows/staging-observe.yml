name: Observe live staging
on:
  push:
    branches: [codex/staging-observe-83a1ac2]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      EXPECTED_COMMIT: 83a1ac227df0be772b7c322fd803c7a2b0d8616e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Observe domain without blocking main CI
        run: python scripts/verify_staging.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Smoke test the deployed application
        working-directory: frontend
        run: npx playwright test --config qa/staging.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-staging-proof
          path: frontend/staging-results/
          retention-days: 14
