name: Restore Drill

# N3-160 (AC4): run a real recovery drill on a schedule and write the
# recovery time into the drill minutes.
#
# The drill takes the newest dump, restores it into a throwaway PostgreSQL,
# measures how long the restore took, proves that every event chain still
# verifies, and records the result in a GitHub issue that acts as the
# minutes of the drill.

on:
  schedule:
    # 03:40 every month, after the nightly backup and the compaction window
    - cron: "40 3 1 * *"
  workflow_dispatch:
    inputs:
      use_external_store:
        description: "Restore from the external backup store instead of a fresh dump"
        default: "true"

permissions:
  contents: read
  issues: write

jobs:
  drill:
    name: 🩺 Restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrochain_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements-dev.txt
          pip install "boto3>=1.34"

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare the dump to restore
        env:
          DATABASE_URL_ENV: ${{ secrets.STAGING_DATABASE_URL }}
          MIGRATION_DATABASE_URL_ENV: ${{ secrets.STAGING_DATABASE_URL }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_ADMIN_USER: ${{ secrets.STAGING_DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          BACKUP_EXTERNAL_BUCKET: ${{ secrets.BACKUP_EXTERNAL_BUCKET }}
          BACKUP_EXTERNAL_ENDPOINT: ${{ secrets.BACKUP_EXTERNAL_ENDPOINT }}
          BACKUP_EXTERNAL_REGION: ${{ secrets.BACKUP_EXTERNAL_REGION }}
          BACKUP_EXTERNAL_ACCESS_KEY_ID: ${{ secrets.BACKUP_EXTERNAL_ACCESS_KEY_ID }}
          BACKUP_EXTERNAL_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_EXTERNAL_SECRET_ACCESS_KEY }}
          BACKUP_EXTERNAL_PREFIX: ${{ secrets.BACKUP_EXTERNAL_PREFIX }}
          USE_EXTERNAL_STORE: ${{ inputs.use_external_store || 'true' }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/drill"
          cd backend
          if [ "${USE_EXTERNAL_STORE}" = "true" ] && [ -n "${BACKUP_EXTERNAL_BUCKET}" ]; then
            echo "Restoring from the external backup store."
            python scripts/backup.py download --directory "${GITHUB_WORKSPACE}/drill"
          else
            echo "::warning::Kho bản sao lưu ngoài chưa được cấu hình, diễn tập dùng bản sao lưu mới chụp từ staging."
            python scripts/backup.py backup --directory "${GITHUB_WORKSPACE}/drill" --keep 1
          fi

      - name: Restore and measure the recovery time
        env:
          DRILL_TARGET_URL: postgresql://postgres:postgres@localhost:5432/agrochain_drill
        run: |
          cd backend
          NEWEST=$(ls -1t "${GITHUB_WORKSPACE}"/drill/agrochain-*.dump | head -n 1)
          python scripts/backup.py verify --dump "${NEWEST}"
          python scripts/backup.py drill \
            --dump "${NEWEST}" \
            --target "${DRILL_TARGET_URL}" \
            --report "${GITHUB_WORKSPACE}/drill/drill-report.json"

      - name: Verify every event chain after the restore
        env:
          MIGRATION_DATABASE_URL_ENV: postgresql://postgres:postgres@localhost:5432/agrochain_drill
          DB_USER: ttcs_app
          DB_PASSWORD: drill-only
          DB_ADMIN_USER: postgres
          DB_ADMIN_PASSWORD: postgres
        run: |
          cd backend
          python -m app.jobs.integrity_scanner --once --all 2>&1 \
            | tee "${GITHUB_WORKSPACE}/drill/integrity-scan.log"

      - name: Record the drill minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          report = json.loads((workspace / "drill" / "drill-report.json").read_text(encoding="utf-8"))
          scan_log = (workspace / "drill" / "integrity-scan.log").read_text(encoding="utf-8")

          broken = None
          for line in scan_log.splitlines():
              if "broken_lots" in line:
                  try:
                      broken = json.loads(line[line.index("{"):]).get("broken_lots")
                  except Exception:
                      broken = None

          seconds = report.get("duration_seconds", 0)
          minutes = round(seconds / 60, 2)
          passed = bool(report.get("passed")) and (broken == 0)
          now = datetime.now(UTC).strftime("%Y-%m-%d %H:%M UTC")

          body = (
              "## Diễn tập khôi phục (N3-160)\n\n"
              f"- Thời điểm: {now}\n"
              f"- Bản sao lưu: `{report.get('dump')}`\n"
              f"- Thời gian khôi phục: **{seconds} giây** (~{minutes} phút)\n"
              f"- Số bảng kiểm tra dòng: {len(report.get('counts') or {})}\n"
              f"- Bảng không khớp: {report.get('mismatches') or 'không có'}\n"
              f"- Lô đứt mạch sau khôi phục: {broken if broken is not None else 'không rõ'}\n"
              f"- Kết quả: **{'ĐẠT' if passed else 'CHƯA ĐẠT'}**\n\n"
              "Biên bản do workflow `Restore Drill` ghi tự động.\n"
          )
          (workspace / "drill" / "drill-minutes.md").write_text(body, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"passed={'true' if passed else 'false'}\n")
              handle.write(f"seconds={seconds}\n")

          print(body)
          PY

      - name: Publish the drill minutes to the repository issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # The minutes are appended to a single long-lived issue so the
          # history stays in one place.
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          minutes = Path(os.environ["GITHUB_WORKSPACE"], "drill", "drill-minutes.md").read_text(encoding="utf-8")
          api = f"https://api.github.com/repos/{repo}/issues"

          def request(url, payload=None, method="GET"):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "AgroChain-Restore-Drill",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  return json.loads(body) if body else {}

          issue = None
          try:
              existing = request(f"{api}?state=open&per_page=100")
              for candidate in existing:
                  if candidate.get("title") == "Biên bản diễn tập khôi phục (N3-160)":
                      issue = candidate
                      break
          except urllib.error.HTTPError as error:
              print(f"Could not list issues: {error}")

          if issue is None:
              created = request(
                  api,
                  {"title": "Biên bản diễn tập khôi phục (N3-160)", "body": minutes},
                  method="POST",
              )
              print(f"Created issue #{created.get('number')}")
          else:
              number = issue["number"]
              comments_url = issue["comments_url"]
              request(
                  comments_url,
                  {"body": minutes},
                  method="POST",
              )
              print(f"Appended to issue #{number}")
          PY

      - name: Upload the drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill
          path: ${{ github.workspace }}/drill/
          retention-days: 90
