# ==============================================================================
# Render Blueprint — Hạ tầng tự động cho Môi trường Staging (Task N3-3)
# Tự động triển khai trọn gói: PostgreSQL + FastAPI Backend + React Frontend
# Khi merge vào nhánh 'main', Render sẽ tự động build và cập nhật lại toàn bộ web.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Dịch vụ Backend API (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: ttcs-backend-staging
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: |
      cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. Dịch vụ Frontend Web (React + Vite) — Static site không có region
  # ----------------------------------------------------------------------------
  - type: web
    name: ttcs-frontend-staging
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ----------------------------------------------------------------------------
  # 3. Cơ sở dữ liệu PostgreSQL (Môi trường Staging)
  # ----------------------------------------------------------------------------
  - name: ttcs-postgres-staging
    region: singapore
    plan: free
    databaseName: ttcs_staging
    user: admin
