services:
  - type: web
    name: ttcs-backend-staging
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: https://ttcs-frontend-staging.onrender.com,http://localhost:5173,http://localhost:3000
      - key: DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString
      - key: MIGRATION_DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString

  - type: web
    name: ttcs-frontend-staging
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ttcs-backend-staging.onrender.com

databases:
  - name: ttcs-postgres-staging
    region: singapore
    plan: free
    databaseName: ttcs_staging
    user: admin
