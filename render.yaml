services:
  - type: web
    name: ttcs-backend-staging
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "False"
      - key: ENABLE_DEMO_LOGIN
        value: "True"
      - key: ALLOWED_ORIGINS
        value: https://ttcs-frontend-staging.onrender.com
      - key: DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString
      - key: MIGRATION_DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString

  - type: web
    name: ttcs-frontend-staging
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://ttcs-backend-staging.onrender.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ttcs-backend-staging.onrender.com
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "true"

databases:
  - name: ttcs-postgres-staging
    region: singapore
    plan: free
    databaseName: ttcs_staging
    user: admin
